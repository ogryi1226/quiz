
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>4択クイズ結果</title>
</head>
<body>

<h1>4択クイズ結果</h1>

<h2 th:text="${msg}"></h2>

<div th:if="${quizFourForm != null}">

    <h3>問題</h3>
    <p th:text="${quizFourForm.question}"></p>

    <h3>あなたの回答</h3>
    <p th:text="${myAnswer} + '番'"></p>

    <h3>正解</h3>
    <p th:text="${quizFourForm.answer} + '番'"></p>

    <p>
        <span th:switch="${quizFourForm.answer}">
            <span th:case="1" th:text="${quizFourForm.option1}"></span>
            <span th:case="2" th:text="${quizFourForm.option2}"></span>
            <span th:case="3" th:text="${quizFourForm.option3}"></span>
            <span th:case="4" th:text="${quizFourForm.option4}"></span>
        </span>
    </p>

</div>

<p>
    <a th:href="@{/quiz/four/play}">もう一度挑戦する</a>
</p>

<p>
    <a th:href="@{/quiz/four}">4択クイズ一覧へ戻る</a>
</p>

<p>
    <a th:href="@{/}">トップ画面へ戻る</a>
</p>

</body>
</html>
